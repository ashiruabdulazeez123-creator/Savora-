<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu – Savora Restaurant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="menu">
  <header id="site-header"></header>

  <main class="menu-page">
    <aside class="menu-side" aria-label="Menu filters">
      <form class="menu-search" id="menu-search-form" role="search">
        <input id="menu-search" type="search" placeholder="Search for food" aria-label="Search for food" autocomplete="off" />
        <button type="submit" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
      </form>
      <h3 class="side-title">Categories</h3>
      <ul class="cat-list" id="menu-cats"></ul>
    </aside>

    <section class="menu-main">
      <div class="menu-top">
        <h1>Our <em>Menu</em></h1>
        <p id="menu-count"></p>
      </div>
      <div class="menu-grid" id="food-menu"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="script.js"></script>
</body>
</html>
