<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In or Register – Savora Restaurant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="login" class="login-body">
  <main class="login-card">
    <div class="login-visual">
      <img src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80" alt="" />
      <div class="login-visual-text">
        <a class="logo" href="index.html" aria-label="Savora home"><svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#e96820"/><path d="M9.5 25.5a10.5 10.5 0 0 1 21 0z" fill="#fff"/><circle cx="20" cy="13" r="1.9" fill="#fff"/><rect x="7" y="27" width="26" height="2.6" rx="1.3" fill="#f4b942"/><path d="M14.5 21a6.5 6.5 0 0 1 3.6-3.4" stroke="#e96820" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".45"/></svg><b class="logo-text">Savora<i>.</i></b></a>
        <div class="swap-text" id="visual-text" aria-live="polite">
          <h2>Your table is <em>waiting</em></h2>
          <p>Log in to see your profile and manage your order.</p>
        </div>
      </div>
    </div>

    <div class="login-form">
      <a class="btn btn-outline btn-sm back-btn" href="index.html">← Back to home</a>

      <div class="auth-tabs" role="tablist" aria-label="Log in or register">
        <span class="auth-pill" aria-hidden="true"></span>
        <button type="button" role="tab" id="tab-login" aria-controls="panel-login" aria-selected="true" data-mode="login">Log in</button>
        <button type="button" role="tab" id="tab-register" aria-controls="panel-register" aria-selected="false" data-mode="register">Register</button>
      </div>

      <div class="auth-slider">
        <div class="auth-track" id="auth-track">
          <!-- LOG IN -->
          <form class="auth-panel" id="panel-login" role="tabpanel" aria-labelledby="tab-login" onsubmit="loginUser(event)">
            <h1>Welcome back</h1>
            <p>Enter your details to log in.</p>

            <div class="field"><label for="login-email">Email Address</label>
              <input id="login-email" type="email" placeholder="Enter your email" autocomplete="email" required /></div>

            <div class="field"><label for="login-password">Password</label>
              <div class="pw-wrap">
                <input id="login-password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
                <button type="button" class="pw-toggle" onclick="togglePw(this)">SHOW</button>
              </div></div>

            <button class="btn" type="submit">LOG IN</button>
            <div class="form-link">Don't have an account? <a href="#register" data-switch="register">Register here</a></div>
          </form>

          <!-- REGISTER -->
          <form class="auth-panel" id="panel-register" role="tabpanel" aria-labelledby="tab-register" onsubmit="registerUser(event)">
            <h1>Create an account</h1>
            <p>Register to start ordering from Savora.</p>

            <div class="field"><label for="reg-name">Full Name</label>
              <input id="reg-name" type="text" placeholder="Enter your full name" autocomplete="name" required /></div>

            <div class="field"><label for="reg-email">Email Address</label>
              <input id="reg-email" type="email" placeholder="Enter your email" autocomplete="email" required /></div>

            <div class="field"><label for="reg-password">Password</label>
              <div class="pw-wrap">
                <input id="reg-password" type="password" placeholder="Create a password (6+ characters)" minlength="6" autocomplete="new-password" required />
                <button type="button" class="pw-toggle" onclick="togglePw(this)">SHOW</button>
              </div></div>

            <button class="btn" type="submit">CREATE ACCOUNT</button>
            <div class="form-link">Already registered? <a href="#login" data-switch="login">Log in</a></div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
