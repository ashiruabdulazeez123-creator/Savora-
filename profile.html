<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile – Savora Restaurant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="profile">
  <header id="site-header"></header>

  <section class="page-banner">
    <img src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1800&q=80" alt="" />
    <div><div class="eyebrow">Your Account</div><h1>My <em>Profile</em></h1></div>
  </section>

  <div class="profile-wrap">
    <div class="profile-card">
      <div class="profile-head">
        <div class="avatar" id="profile-avatar">S</div>
        <div>
          <h2 id="profile-name">Name</h2>
          <p id="profile-email">email</p>
        </div>
        <div class="profile-actions">
          <button class="btn btn-sm" onclick="editProfile()">EDIT NAME</button>
          <button class="btn btn-sm btn-outline" onclick="logoutUser()">LOG OUT</button>
        </div>
      </div>

      <h3 class="order-title">Your Order (<span id="profile-order">0</span> items)</h3>
      <div id="order-items"></div>
    </div>
  </div>

  <footer id="site-footer"></footer>
  <script src="script.js"></script>
</body>
</html>
